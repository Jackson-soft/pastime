# mpv 0.42 · RTX 4080 SUPER · OLED HDR · uosc + thumbfast

# 渲染器
gpu-api=d3d11

# 硬件解码
hwdec=auto-safe
vd-lavc-film-grain=yes

# 画质
profile=high-quality

# 缩放
scale=ewa_lanczossharp
cscale=ewa_lanczossharp
scale-antiring=0.7
cscale-antiring=0.7

# 去色带
deband=yes
deband-iterations=4
deband-threshold=64
deband-range=20
deband-grain=6

# 补帧
interpolation=yes
tscale=oversample

# HDR
target-colorspace-hint=yes
hdr-compute-peak=yes
tone-mapping=spline

# 音频
ao=wasapi

# 字幕
sub-auto=fuzzy

# 截图
screenshot-format=png
screenshot-high-bit-depth=yes

# 缓存
demuxer-max-bytes=2GiB
demuxer-max-back-bytes=512MiB

# 语言偏好
alang=chi,zho,zh,zh-CN,zh-TW,zh-HK
slang=chi,zho,zh,zh-CN,zh-TW,zh-HK

# 播放
save-position-on-quit=yes
keep-open=yes
hr-seek-framedrop=no

# uosc
osd-bar=no
border=no

# 窗口
cursor-autohide=1000
