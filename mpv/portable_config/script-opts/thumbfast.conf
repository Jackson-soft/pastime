# 缩略图生成最大尺寸（px）
max_height=200
max_width=200

# 缩略图显示缩放（mpv 0.38+，质量低于提高 max_width/height）
scale_factor=1

# 色调映射：auto / no
tone_mapping=auto

# overlay id
overlay_id=42

# 加载时立即启动缩略图进程
spawn_first=yes

# 空闲多少秒后关闭缩略图进程，0 表示不关闭
quit_after_inactivity=0

# 是否对网络流启用
network=no

# 是否对纯音频启用
audio=no

# 缩略图进程是否硬解
hwdec=yes

# 仅 Windows：使用原生 API 写管道（需 LuaJIT）
direct_io=yes

# mpv 可执行文件路径
mpv_path=mpv
