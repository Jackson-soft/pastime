SPACE cycle pause

RIGHT seek 5
LEFT seek -5

UP seek 60
DOWN seek -60

WHEEL_UP add volume 5
WHEEL_DOWN add volume -5

m cycle mute

] add speed 0.1
[ add speed -0.1

BS set speed 1.0

f cycle fullscreen

s screenshot video

a cycle audio
j cycle sub
v cycle sub-visibility

i script-binding stats/display-stats-toggle

TAB script-binding modernz/visibility

ENTER script-binding select/menu
